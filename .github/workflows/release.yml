name: Release

# Triggered by pushing a tag like v0.2.0. The version in lib/satsrail.rb must
# match the tag (without the leading v) or the publish will fail loudly.
#
# Uses RubyGems trusted publishing (OIDC) — no RUBYGEMS_API_KEY secret to
# rotate. Requires one-time setup on rubygems.org:
#   1. rubygems.org → satsrail gem → Settings → Trusted publishers
#   2. Add GitHub publisher: SatsRail/satsrail-ruby, workflow release.yml
# See https://guides.rubygems.org/trusted-publishing/ for the one-time setup.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec

      - name: Verify tag matches version
        run: |
          TAG="${GITHUB_REF##*/v}"
          VERSION=$(ruby -e "require_relative 'lib/satsrail'; print SatsRail::VERSION")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match SatsRail::VERSION $VERSION"
            exit 1
          fi

      - uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Build gem
        run: gem build satsrail.gemspec

      - name: Publish to RubyGems
        run: gem push satsrail-*.gem
